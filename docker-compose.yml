name: cahy-wiki

x-backend: &backend
  # Thẻ ảnh ghim theo phiên bản (không dùng thẻ trôi nổi); đổi BACKEND_IMAGE trong .env khi dựng bản mới
  image: ${BACKEND_IMAGE:-cahy-wiki-backend:0.1.0}
  env_file: ${APP_ENV_FILE:-.env}
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ./temp_uploads:/app/temp_uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cahy_wiki_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arkon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ${POSTGRES_ALIAS:-wiki_postgres}
          - wiki2_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkon} -d ${POSTGRES_DB:-arkon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Redis 7.2 là dòng cuối còn giấy phép BSD-3 (7.4+ chuyển sang RSALv2/SSPL). Hệ thống đang chạy redis:7 (7.4)
    # phải xoá volume redis_data trước khi đổi (7.2 không đọc được tệp RDB của 7.4; volume chỉ chứa hàng đợi tạm).
    # Thay thế tương đương: valkey/valkey:8-alpine (BSD-3).
    image: redis:7.2-alpine
    container_name: cahy_wiki_redis
    restart: always
    command: ["redis-server", "--save", "60", "1", "--requirepass", "${REDIS_PASSWORD:-arkon_secret}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-arkon_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO (AGPL-3.0, dịch vụ độc lập, không sửa mã) ghim theo bản phát hành. Kho Docker Hub minio/minio
    # không còn công khai: ảnh lấy từ gói cài ngoại tuyến / registry nội bộ.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cahy_wiki_minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: cahy_wiki_etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: cahy_wiki_milvus
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${MILVUS_PORT_HOST:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s

  milvus_ui:
    # Attu dòng v2.4 tương thích Milvus v2.4.15 (dòng v3 nhắm Milvus mới hơn)
    image: zilliz/attu:v2.4.12
    container_name: cahy_wiki_milvus_ui
    restart: always
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-9004}:3000"
    depends_on:
      - milvus

  migrator:
    <<: *backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cahy_wiki_migrator
    restart: "no"
    entrypoint: []
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    container_name: cahy_wiki_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-5055}:5055"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5055", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      default:
      cahy-internal:
        aliases:
          - ${API_NETWORK_ALIAS:-wiki_api}
          - wiki2_api

  worker:
    <<: *backend
    container_name: cahy_wiki_worker
    # Longer than WORKER_SHUTDOWN_WAIT_S so running jobs finish instead of being SIGKILLed.
    stop_grace_period: 330s
    depends_on:
      api:
        condition: service_healthy
    command: ["arq", "app.worker.WorkerSettings"]

  worker_skills:
    <<: *backend
    container_name: cahy_wiki_worker_skills
    # Longer than WORKER_SHUTDOWN_WAIT_S so running jobs finish instead of being SIGKILLed.
    stop_grace_period: 330s
    depends_on:
      api:
        condition: service_healthy
    command: ["arq", "app.worker.SkillWorkerSettings"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5155}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:5055}
    # Thẻ ảnh ghim theo phiên bản (không dùng thẻ trôi nổi); đổi FRONTEND_IMAGE trong .env khi dựng bản mới
    image: ${FRONTEND_IMAGE:-cahy-wiki-frontend:0.1.0}
    container_name: cahy_wiki_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3119}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5155}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://api:5055}
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
  cahy-internal:
    external: true
    name: ${CAHY_NETWORK_NAME:-cahy-internal}

volumes:
  postgres_data:
    external: true
    name: cahy-wiki_postgres_data
  redis_data:
    external: true
    name: cahy-wiki_redis_data
  minio_data:
    external: true
    name: cahy-wiki_minio_data
  milvus_etcd_data:
    external: true
    name: cahy-wiki_milvus_etcd_data
  milvus_data:
    external: true
    name: cahy-wiki_milvus_data
