[project]
name = "cahy-kho-tri-thuc"
version = "0.1.0"
description = "CAHY Kho tri thuc - nhanh c2 (clean-room)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "loguru",
    "pyjwt",
    "openai",
    "fastmcp",
    "langfuse",
    "pymilvus",
    "pymupdf",
    "pymupdf4llm",
    "python-docx",
    "mammoth",
    "openpyxl",
    "xlrd",
    "python-pptx",
    "markitdown",
    "pandas",
    "duckdb",
    "pillow",
    "pyvi",
    "uvicorn[standard]",
    "python-multipart",
    "pgvector",
    "minio",
    "arq",
    "redis",
    "bcrypt",
    "cryptography",
    "tiktoken",
    "anthropic",
    "google-genai",
    "tabulate",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
