[project]
name = "arkon"
version = "0.1.0"
description = "Enterprise AI Control Center — Knowledge Base & Skill Management for Claude"
authors = [
    {name = "Arkon Team"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.9",
    # Database & Vector Store
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pymilvus>=2.4.0",
    # AI / LLM (provider-agnostic — user picks at runtime)
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "langfuse>=2.0.0",
    # MCP Server
    "fastmcp>=2.0.0",
    # Auth
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    # Content processing
    "content-core>=1.14.1,<2",
    # Image extraction
    "pymupdf>=1.25.0",
    # Default PDF engine (config_service pdf_engine="pymupdf4llm")
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    # Storage
    "minio>=7.2.0",
    # Utilities
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.0",
    # Worker queue
    "arq>=0.26",
    "redis[hiredis]>=5.0",
    # Security
    "cryptography>=44.0",
    "mammoth>=1.12.0",
    # Tokenization & NLP
    "tiktoken>=0.8.0",
    "pyvi>=0.1.1",
    # Spreadsheet extraction & Analytics
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "tabulate>=0.9",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "xlwt>=1.3.0",  # builds legacy .xls fixtures in tests
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
